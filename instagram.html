
<!DOCTYPE html>
<html>
<head>
    <title>Instagram Login Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 35px;
            background-color: white;
        }

        .container {
            display: flex;
            background-color: #0c0f14;
            color: white;
            height: 600px;
            border: 1px solid lightgray;
        }

        .left {
            width: 50%;
            border-right: 1px solid #333;
            padding: 30px;
            box-sizing: border-box;
        }

        .logo {
            width: 55px;
            height: 55px;
        }

        .message {
            text-align: center;
            font-size: 30px;
            margin-top: 65px;
            line-height: 1.5;
        }

        .gradient {
            background: linear-gradient(
                90deg, #ffb347, #ff416c, #c13584
            );
            color: transparent;
            background-clip: text;
        }

        .promo {
            display: block;
            width: 260px;
            height: 240px;
            object-fit: cover;
            border-radius: 12px;
            margin: 25px auto;
        }

        .right {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login {
            width: 65%;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            margin: 6px 0;
            background-color: #0c0f14;
            border: 1px solid #444;
            border-radius: 18px;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 16px;
            background-color: #4969e8;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: white;
            text-decoration: none;
        }

        .center {
            text-align: center;
            margin-top: 25px;
        }

        .facebook {
            background-color: #292d32;
        }

        .create {
            background-color: #0c0f14;
            border: 1px solid #4969e8;
            color: #5795ff;
            margin-top: 14px;
        }

        .meta {
            text-align: center;
            color: #bbb;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <h1>Instagram Login Page - Output</h1>

    <div class="container">

        <div class="left">

            <!-- Instagram Logo -->
            <svg class="logo" viewBox="0 0 100 100"
                 xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="ig" x1="0" y1="1"
                                    x2="1" y2="0">
                        <stop offset="0%" stop-color="#ffb347"/>
                        <stop offset="50%" stop-color="#ed4264"/>
                        <stop offset="100%" stop-color="#833ab4"/>
                    </linearGradient>
                </defs>

                <rect x="12" y="12" width="76" height="76"
                      rx="22" fill="none" stroke="url(#ig)"
                      stroke-width="9"/>

                <circle cx="50" cy="50" r="19"
                        fill="none" stroke="url(#ig)"
                        stroke-width="8"/>

                <circle cx="73" cy="28" r="5"
                        fill="#e64783"/>
            </svg>

            <div class="message">
                See everyday moments from<br>
                your <span class="gradient">close friends.</span>
            </div>

            <!-- Promotional Image -->
            <img class="promo"
                 src="https://images.pexels.com/photos/2725253/pexels-photo-2725253.jpeg"
                 alt="Friends spending time together"
                 onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=600&h=600&fit=crop';">

        </div>

        <div class="right">

            <div class="login">

                <h3>Log into Instagram</h3>

                <input type="text"
                       placeholder="Mobile number, username or email">

                <input type="password"
                       placeholder="Password">

                <button type="button">Log in</button>

                <p class="center">
                    <a href="#">Forgot password?</a>
                </p>

                <button class="facebook" type="button">
                    Log in with Facebook
                </button>

                <button class="create" type="button">
                    Create new account
                </button>

                <p class="meta">∞ Meta</p>

            </div>

        </div>

    </div>

</body>
</html>
